name: Release aurora

on:
  push:
    tags: ["aurora-v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish aurora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service and the packer
        run: |
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
          cargo build --locked --release -p skyward-pack
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
      - name: Ask which stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config devices/aurora.toml >> "$GITHUB_OUTPUT"
      - name: Take the recovery partition out of the stock package
        run: tools/skyward-pack stock --config devices/aurora.toml --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        env:
          VERSION: ${{ steps.stock.outputs.version }}
        run: |
          name="skyward-aurora-${GITHUB_REF_NAME#aurora-}-$VERSION"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --config devices/aurora.toml \
            --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          (cd out && zip -9 "$name.zip" "$name.img")
          sha256sum "out/$name.zip" | sed 's|out/||' > SHA256SUMS.txt
          echo "name=$name" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          # Skyward for aurora · 小米 14 Ultra

          kirklin/skyward 的小米 14 Ultra（aurora）移植版。数据解密已启用。

          ## 刷入（前提：BL 已解锁）

          \`\`\`
          adb reboot bootloader
          fastboot flash recovery 解压出的 .img
          \`\`\`

          进入 recovery：关机后按住「电源 + 音量上」，或 adb reboot recovery。
          回滚：fastboot flash recovery 原厂备份.img
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "Skyward for aurora · Xiaomi 14 Ultra" \
            --notes-file notes.md "out/$name.zip#Xiaomi 14 Ultra (aurora)" SHA256SUMS.txt
