[device]
codename = "nuwa"
brand = "Xiaomi"
model = "Xiaomi 13 Pro"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# TODO(nuwa): confirm from the installed system, not the spec sheet:
#   adb shell getprop ro.sf.lcd_density
#   adb shell wm size
# 1440x3200 on a 6.73" LTPO panel; ishtar (same panel class) uses 560 dpi and
# a 140 px corner radius, which is the starting guess here.
width = 1440
height = 3200
density = 560
diagonal = 6.73
corner_radius = 140

[modules]
# Android 13 keeps modules on all three; the order is the search order.
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# Confirmed in the phone's `vendor_dlkm` (EROFS, read with tools/erofs.py):
# fts_touch_spi.ko, the FocalTech SPI driver, alongside xiaomi_touch.ko which
# the vendor system starts on top of it.
load = ["fts_touch_spi"]

# Not configured, deliberately: ishtar (same SoC) reaches the WLAN firmware
# through /vendor and keeps the MAC address in persist without mounting it,
# so [firmware] and [partitions] are left out here. If nuwa's WLAN firmware
# turns out to live on modem instead, add what nezha has:
#   [firmware]
#   partition = "modem"
#   [partitions]
#   mounted = ["persist"]

# Every program below runs as the user, in the groups and with the
# capabilities its init script on the phone gives it, so what it creates in
# the data partition belongs to the right owner when Android runs again.
#
# Order matters: the programs start in the order written, and one that
# declares something to wait for holds up the ones after it. The touch
# processing has no dependency and is first, so a service that fails to come
# up still leaves touch working.
#
# TODO(nuwa): this set is inherited from ishtar (same SoC, Android 16).
# nuwa ships Android 13, so verify every path and readiness property:
#   adb shell ls /vendor/etc/init | grep -E 'qseecom|keymint|gatekeeper|boot'
#   adb shell getprop | grep -E 'hwservicemanager|keymint|gatekeeper'

# The panel hands raw frames to the host: touch_report turns them into
# touches, touchsensor tells water, gloves and screen protectors apart with
# the models in /odm/firmware.
[[service]]
path = "/odm/bin/touch_report"
user = "system"
groups = ["system", "uhid", "input"]
capabilities = ["SYS_NICE"]

[[service]]
path = "/odm/bin/touchsensor"
libraries = ["/odm/lib64", "/system/lib64"]
user = "system"
groups = ["system", "uhid", "input"]

# The secure world reaches back into Android through the listeners this
# daemon registers; without them the key service cannot use any key.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The key service, the only thing that can use keys the phone wrapped in
# hardware. Decryption of the data partition needs it.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
user = "system"
groups = ["system", "drmrpc"]

# The directory the older HIDL services register with. A recovery carries
# none of it, so this is the installed system's own program against the
# installed system's libraries; it reports ready by the property those
# services wait on.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# The credential service: the secure world has it check a screen lock, and
# it is the only thing that can hand out the note the key service wants
# before using a key a screen lock guards.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# The boot control, which says which slot the bootloader starts next and
# switches it. It comes last: the phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"
user = "root"
groups = ["root"]

# WLAN: the WCN7850 on PCIe driven by qca_cld3_kiwi_v2 over cnss2. nuwa is
# the same SoC as ishtar, so the module and firmware paths are expected to
# match.
# TODO(nuwa): confirm with
#   adb shell ls /vendor/lib/modules | grep qca_cld
#   adb shell ls /vendor/etc/wifi
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is built on: the phone's own recovery image
# with Skyward's binary in place of its recovery service, so the stock init,
# adbd and SELinux policy stay.
#
# The NikoHyper package cannot serve: its firmware-update/recovery.img is TWRP
# (prop.default says twrp_nuwa) and skyward-pack refuses a ramdisk holding
# twres/. So this names nuwa's own official build instead, and the packer reads
# only the recovery partition out of the package on Xiaomi's server: 7.1 GB in
# all, a few tens of megabytes read.
#
# The firmware in the NikoHyper package identifies as this very build — its
# vendor_boot command line carries swinfo.fingerprint=nuwa:13/OS3.0.311.0.WMBCNXM
# — so the recovery matches the rest of what is flashed.
#
# `recovery` is the SHA-256 of the recovery partition inside that package, read
# out of it rather than trusted: the packer verified the partition against the
# payload's own manifest and then against this value.
[stock]
version = "OS3.0.311.0.WMBCNXM"
package = "https://cdnorg.d.miui.com/OS3.0.311.0.WMBCNXM/nuwa-ota_full-OS3.0.311.0.WMBCNXM-user-16.0-0113895944.zip"
recovery = "3cf83635659f5bd81ba35b7be35629bf90f02d591af29f445005154e24325bc2"

# The motor. Confirmed on the phone: /sys/class/qcom-haptics exists and
# /dev/input/event1 is "qcom-hv-haptics" with the force-feedback bits that
# carry a driver-kept waveform (ff=0x120270000, which includes FF_CUSTOM).
# Waveform 0 is the click, as on ishtar: the same driver, the same linear
# motor. Qualcomm's vibrator HAL plays a light strength at half of a
# waveform's drive and a strong one at the whole of it.
[haptics]
click = 0
strength = { lightest = 0.5, strongest = 1.0 }

# The partitions a baseband/EFS backup takes, and what of the data partition
# a backup leaves out because the secure world keeps it in step with itself.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/mitee", "vendor/goodix", "vendor/fingerprint", "vendor/fpdata", "vendor/misc/mi_fp"]

# Where the phone's own programs keep logs in the data partition.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
